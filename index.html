<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Neon Snake</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #05050d;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00ffcc;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
      pointer-events: none;
    }

    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff0055;
      text-align: center;
      display: none;
      text-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
    }

    #game-over h1 {
      font-size: 50px;
      margin: 0 0 10px 0;
    }

    #game-over p {
      color: #ffffff;
      font-size: 18px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">SCORE: <span id="score">0</span></div>
  
  <div id="game-over">
    <h1>GAME OVER</h1>
    <p>Press <strong>SPACE</strong> to Restart</p>
  </div>

  <script>
    // --- CONSTANTS & CONFIG ---
    const BOARD_SIZE = 16; // 16x16 grid
    const STEP_TIME = 150; // Snake moves every 150ms

    // --- SETUP SCENE, CAMERA, RENDERER ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05050d, 0.025);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -18, 18);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, -20, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Dynamic point light for food glow
    const foodLight = new THREE.PointLight(0xff0055, 2, 8);
    scene.add(foodLight);

    // --- BOARD / GRID ---
    const boardGeo = new THREE.BoxGeometry(BOARD_SIZE, BOARD_SIZE, 0.5);
    const boardMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.8 });
    const board = new THREE.Mesh(boardGeo, boardMat);
    board.position.z = -0.25;
    board.receiveShadow = true;
    scene.add(board);

    // Neon grid border
    const gridHelper = new THREE.GridHelper(BOARD_SIZE, BOARD_SIZE, 0x00ffcc, 0x222244);
    gridHelper.rotation.x = Math.PI / 2;
    scene.add(gridHelper);

    // --- GAME STATE ---
    let snake = [];
    let dir = { x: 0, y: 1 };
    let nextDir = { x: 0, y: 1 };
    let food = { x: 0, y: 0 };
    let foodMesh, snakeGroup;
    let score = 0;
    let isGameOver = false;
    let lastStepTime = 0;

    // Materials
    const headMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x008866, roughness: 0.2 });
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00b386, roughness: 0.3 });
    const foodMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x990033, roughness: 0.1 });

    const boxGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
    const sphereGeo = new THREE.SphereGeometry(0.45, 16, 16);

    // Initialize Group for snake segments
    snakeGroup = new THREE.Group();
    scene.add(snakeGroup);

    // --- GAME FUNCTIONS ---
    function initGame() {
      // Clear old meshes
      while(snakeGroup.children.length > 0) {
        snakeGroup.remove(snakeGroup.children[0]);
      }
      if (foodMesh) scene.remove(foodMesh);

      // Reset state
      snake = [
        { x: 0, y: 0 },
        { x: 0, y: -1 },
        { x: 0, y: -2 }
      ];
      dir = { x: 0, y: 1 };
      nextDir = { x: 0, y: 1 };
      score = 0;
      isGameOver = false;
      document.getElementById('score').innerText = score;
      document.getElementById('game-over').style.display = 'none';

      // Create Food Mesh
      foodMesh = new THREE.Mesh(sphereGeo, foodMat);
      foodMesh.castShadow = true;
      scene.add(foodMesh);

      spawnFood();
      updateSnakeMeshes();
    }

    function spawnFood() {
      const half = BOARD_SIZE / 2;
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * BOARD_SIZE) - half + 0.5;
        food.y = Math.floor(Math.random() * BOARD_SIZE) - half + 0.5;
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
      foodMesh.position.set(food.x, food.y, 0.45);
      foodLight.position.set(food.x, food.y, 1);
    }

    function updateSnakeMeshes() {
      // Re-create meshes based on array
      while(snakeGroup.children.length > 0) {
        snakeGroup.remove(snakeGroup.children[0]);
      }

      snake.forEach((segment, index) => {
        const mesh = new THREE.Mesh(boxGeo, index === 0 ? headMat : bodyMat);
        mesh.position.set(segment.x, segment.y, 0.45);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        snakeGroup.add(mesh);
      });
    }

    function gameStep() {
      if (isGameOver) return;

      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      const half = BOARD_SIZE / 2;
      // Wall Collision
      if (head.x < -half || head.x > half || head.y < -half || head.y > half) {
        return gameOver();
      }

      // Self Collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // Eat Food
      if (Math.abs(head.x - food.x) < 0.1 && Math.abs(head.y - food.y) < 0.1) {
        score += 10;
        document.getElementById('score').innerText = score;
        spawnFood();
      } else {
        snake.pop(); // Remove tail
      }

      updateSnakeMeshes();
    }

    function gameOver() {
      isGameOver = true;
      document.getElementById('game-over').style.display = 'block';
    }

    // --- CONTROLS ---
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          if (dir.y === 0) nextDir = { x: 0, y: 1 };
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          if (dir.y === 0) nextDir = { x: 0, y: -1 };
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          if (dir.x === 0) nextDir = { x: -1, y: 0 };
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          if (dir.x === 0) nextDir = { x: 1, y: 0 };
          break;
        case ' ':
          if (isGameOver) initGame();
          break;
      }
    });

    // Handle Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- RENDER LOOP ---
    function animate(currentTime) {
      requestAnimationFrame(animate);

      // Game tick speed
      if (currentTime - lastStepTime > STEP_TIME) {
        gameStep();
        lastStepTime = currentTime;
      }

      // Animate food pulse & rotation
      if (foodMesh) {
        foodMesh.rotation.y += 0.03;
        foodMesh.position.z = 0.45 + Math.sin(currentTime * 0.005) * 0.1;
      }

      renderer.render(scene, camera);
    }

    // Start Game
    initGame();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
