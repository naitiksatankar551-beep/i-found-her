<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What I Was Looking For - Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #fce4ec; /* Light pink background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Fredoka One', cursive;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px; /* Mobile aspect ratio similar to Reels */
            height: 100vh;
            max-height: 800px;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Start Button */
        #startBtn {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Fredoka One', cursive;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.4);
            transition: transform 0.2s;
        }

        #startBtn:active {
            transform: scale(0.95);
        }

        /* Text Animations */
        .lyric {
            position: absolute;
            font-size: 3.5rem;
            color: white;
            text-align: center;
            text-shadow: 3px 3px 0 #ff4081, -1px -1px 0 #ff4081, 1px -1px 0 #ff4081, -1px 1px 0 #ff4081, 1px 1px 0 #ff4081;
            opacity: 0;
            transform: scale(0.5);
            pointer-events: none;
            width: 100%;
        }

        .lyric.emoji-text {
            font-size: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* Polaroid Animations */
        .polaroids {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .polaroid {
            position: absolute;
            background: white;
            padding: 10px 10px 40px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            opacity: 0;
            transform: scale(0.5) translateY(100px);
            width: 180px;
            border-radius: 2px;
        }

        .polaroid img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #eee;
        }

        .polaroid-text {
            position: absolute;
            bottom: 5px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: 'Pacifico', cursive;
            color: #ff4081;
            font-size: 1.5rem;
        }

        /* Keyframes */
        @keyframes popInOut {
            0% { opacity: 0; transform: scale(0.5); }
            15% { opacity: 1; transform: scale(1.1); }
            30% { transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.3); }
        }

        @keyframes polaroidDrop {
            0% { opacity: 0; transform: scale(1.5) translateY(-50px) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotate(var(--rot)); }
        }

        /* Active Classes triggered by JS */
        .animate-text {
            animation: popInOut 1.2s forwards ease-in-out;
        }

        .animate-polaroid {
            animation: polaroidDrop 0.6s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Specific Polaroid Placements */
        .p1 { top: 20%; left: 10%; --rot: -15deg; }
        .p2 { top: 40%; right: 10%; --rot: 10deg; }
        .p3 { top: 60%; left: 20%; --rot: -5deg; }
        
        .final-her {
            position: absolute;
            font-size: 5rem;
            color: #ff4081;
            font-family: 'Pacifico', cursive;
            text-shadow: 2px 2px 0 white;
            opacity: 0;
            z-index: 50;
        }
        
        @keyframes popInStay {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .animate-final {
            animation: popInStay 0.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

    </style>
</head>
<body>

    <!-- Optional: Add the song file here if you have it -->
    <audio id="bgMusic" src="your-song-file.mp3" preload="auto"></audio>

    <div class="container">
        <button id="startBtn">Play Animation</button>

        <!-- Lyrics Sequence -->
        <div class="lyric" id="t1">what i was</div>
        <div class="lyric emoji-text" id="t2">
            <span>looking</span>
            <span style="font-size: 4rem;">👁️✨</span>
            <span>for</span>
        </div>
        <div class="lyric" id="t3">till i</div>
        <div class="lyric" id="t4">found</div>

        <!-- Final "Her" Text -->
        <div class="final-her" id="finalText">Her</div>

        <!-- Polaroids Sequence -->
        <div class="polaroids">
            <div class="polaroid p1" id="p1">
                <!-- Replace src with your own image URLs -->
                <img src="https://via.placeholder.com/160x160/ffb6c1/ffffff?text=Photo+1" alt="Her">
                <div class="polaroid-text">Her</div>
            </div>
            <div class="polaroid p2" id="p2">
                <img src="https://via.placeholder.com/160x160/ffb6c1/ffffff?text=Photo+2" alt="Her">
                <div class="polaroid-text">Her</div>
            </div>
            <div class="polaroid p3" id="p3">
                <img src="https://via.placeholder.com/160x160/ffb6c1/ffffff?text=Photo+3" alt="Her">
                <div class="polaroid-text">Her</div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('startBtn').addEventListener('click', function() {
            // Hide start button
            this.style.display = 'none';

            // Optional: Play audio if you added an mp3 source
            const audio = document.getElementById('bgMusic');
            if(audio.getAttribute('src') !== 'your-song-file.mp3') {
                audio.play();
            }

            // Timeline Sequence (Adjust milliseconds to sync perfectly with your audio file)
            
            // "what i was"
            setTimeout(() => {
                document.getElementById('t1').classList.add('animate-text');
            }, 100);

            // "looking for"
            setTimeout(() => {
                document.getElementById('t2').classList.add('animate-text');
            }, 1300);

            // "till i"
            setTimeout(() => {
                document.getElementById('t3').classList.add('animate-text');
            }, 2500);

            // "found"
            setTimeout(() => {
                document.getElementById('t4').classList.add('animate-text');
            }, 3500);

            // Scatter Polaroids and final "Her" text
            setTimeout(() => {
                document.getElementById('finalText').classList.add('animate-final');
                document.getElementById('p1').classList.add('animate-polaroid');
            }, 4500);

            setTimeout(() => {
                document.getElementById('p2').classList.add('animate-polaroid');
            }, 4900);

            setTimeout(() => {
                document.getElementById('p3').classList.add('animate-polaroid');
            }, 5300);
        });
    </script>
</body>
  </html>
