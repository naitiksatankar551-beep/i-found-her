<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile 3D Cyberpunk Snake</title>
  <style>
    * {
      touch-action: manipulation;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #020208;
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #00f3ff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
      pointer-events: none;
      z-index: 10;
    }

    #game-over {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 25, 0.9);
      border: 2px solid #ff0055;
      padding: 25px 35px;
      border-radius: 15px;
      text-align: center;
      display: none;
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
      backdrop-filter: blur(8px);
      z-index: 20;
      width: 70%;
      max-width: 300px;
    }

    #game-over h1 {
      color: #ff0055;
      font-size: 36px;
      margin: 0 0 10px 0;
      text-shadow: 0 0 10px #ff0055;
    }

    #restart-btn {
      margin-top: 15px;
      background: #ff0055;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 0 10px #ff0055;
    }

    /* TOUCH CONTROLS FOR MOBILE */
    #touch-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(3, 65px);
      grid-template-rows: repeat(2, 65px);
      gap: 10px;
      z-index: 10;
    }

    .btn {
      background: rgba(0, 243, 255, 0.15);
      border: 2px solid #00f3ff;
      color: #00f3ff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
      active-background: rgba(0, 243, 255, 0.4);
    }

    .btn:active {
      background: rgba(0, 243, 255, 0.5);
    }

    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">SCORE: <span id="score">0</span></div>
  
  <div id="game-over">
    <h1>GAME OVER</h1>
    <button id="restart-btn" onclick="initGame()">RESTART</button>
  </div>

  <div id="touch-controls">
    <div class="btn" id="btn-up">▲</div>
    <div class="btn" id="btn-left">◀</div>
    <div class="btn" id="btn-down">▼</div>
    <div class="btn" id="btn-right">▶</div>
  </div>

  <script>
    const GRID_SIZE = 16;
    const STEP_TIME = 140;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020208, 0.03);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -18, 18);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(10, -15, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const headLight = new THREE.PointLight(0x00f3ff, 2, 8);
    scene.add(headLight);
    const foodLight = new THREE.PointLight(0xff0055, 3, 10);
    scene.add(foodLight);

    // Board
    const boardMat = new THREE.MeshStandardMaterial({ color: 0x0a0a18, roughness: 0.3, metalness: 0.8 });
    const board = new THREE.Mesh(new THREE.BoxGeometry(GRID_SIZE, GRID_SIZE, 0.4), boardMat);
    board.position.z = -0.2;
    board.receiveShadow = true;
    scene.add(board);

    const gridHelper = new THREE.GridHelper(GRID_SIZE, GRID_SIZE, 0x00f3ff, 0x1a1a3a);
    gridHelper.rotation.x = Math.PI / 2;
    scene.add(gridHelper);

    // Variables
    let snake = [], snakeMeshes = [];
    let dir = { x: 0, y: 1 }, nextDir = { x: 0, y: 1 };
    let food = { x: 0, y: 0 }, foodMesh;
    let score = 0, isGameOver = false, lastStepTime = 0;

    const sphereGeo = new THREE.SphereGeometry(0.45, 16, 16);
    const headMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x006688, metalness: 0.8 });
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0088aa, metalness: 0.5 });
    const foodMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x880022 });

    function initGame() {
      snakeMeshes.forEach(mesh => scene.remove(mesh));
      snakeMeshes = [];
      if (foodMesh) scene.remove(foodMesh);

      snake = [{ x: 0, y: 1 }, { x: 0, y: 0 }, { x: 0, y: -1 }];
      dir = { x: 0, y: 1 };
      nextDir = { x: 0, y: 1 };
      score = 0;
      isGameOver = false;

      document.getElementById('score').innerText = score;
      document.getElementById('game-over').style.display = 'none';

      foodMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.4, 0), foodMat);
      scene.add(foodMesh);

      snake.forEach((seg, idx) => {
        const mesh = new THREE.Mesh(sphereGeo, idx === 0 ? headMat : bodyMat);
        mesh.position.set(seg.x, seg.y, 0.45);
        scene.add(mesh);
        snakeMeshes.push(mesh);
      });

      spawnFood();
    }

    function spawnFood() {
      const half = GRID_SIZE / 2;
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * GRID_SIZE) - half + 0.5;
        food.y = Math.floor(Math.random() * GRID_SIZE) - half + 0.5;
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
      foodMesh.position.set(food.x, food.y, 0.45);
      foodLight.position.set(food.x, food.y, 1.2);
    }

    function gameStep() {
      if (isGameOver) return;
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      const half = GRID_SIZE / 2;

      if (head.x < -half || head.x > half || head.y < -half || head.y > half || snake.some(s => s.x === head.x && s.y === head.y)) {
        isGameOver = true;
        document.getElementById('game-over').style.display = 'block';
        return;
      }

      snake.unshift(head);

      if (Math.abs(head.x - food.x) < 0.1 && Math.abs(head.y - food.y) < 0.1) {
        score += 10;
        document.getElementById('score').innerText = score;
        const newMesh = new THREE.Mesh(sphereGeo, bodyMat);
        scene.add(newMesh);
        snakeMeshes.push(newMesh);
        spawnFood();
      } else {
        snake.pop();
      }

      headLight.position.set(snake[0].x, snake[0].y, 1.2);
    }

    // --- CONTROLS LOGIC (KEYBOARD + TOUCH BUTTONS + SWIPE) ---
    function setDirection(x, y) {
      if (x !== 0 && dir.x === 0) nextDir = { x, y: 0 };
      if (y !== 0 && dir.y === 0) nextDir = { x: 0, y };
    }

    // Touch Buttons
    document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(0, 1); });
    document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(0, -1); });
    document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(-1, 0); });
    document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); setDirection(1, 0); });

    // Also support Click (for testing on desktop with mouse)
    document.getElementById('btn-up').onclick = () => setDirection(0, 1);
    document.getElementById('btn-down').onclick = () => setDirection(0, -1);
    document.getElementById('btn-left').onclick = () => setDirection(-1, 0);
    document.getElementById('btn-right').onclick = () => setDirection(1, 0);

    // Swipe Controls
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, false);

    window.addEventListener('touchend', (e) => {
      let diffX = e.changedTouches[0].screenX - touchStartX;
      let diffY = e.changedTouches[0].screenY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 30) setDirection(1, 0);
        else if (diffX < -30) setDirection(-1, 0);
      } else {
        if (diffY > 30) setDirection(0, -1);
        else if (diffY < -30) setDirection(0, 1);
      }
    }, false);

    // Keyboard Controls
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') setDirection(0, 1);
      if (k === 'arrowdown' || k === 's') setDirection(0, -1);
      if (k === 'arrowleft' || k === 'a') setDirection(-1, 0);
      if (k === 'arrowright' || k === 'd') setDirection(1, 0);
      if (k === ' ' && isGameOver) initGame();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(currentTime) {
      requestAnimationFrame(animate);

      if (currentTime - lastStepTime > STEP_TIME) {
        gameStep();
        lastStepTime = currentTime;
      }

      snake.forEach((seg, i) => {
        if (snakeMeshes[i]) {
          snakeMeshes[i].position.x += (seg.x - snakeMeshes[i].position.x) * 0.3;
          snakeMeshes[i].position.y += (seg.y - snakeMeshes[i].position.y) * 0.3;
          snakeMeshes[i].position.z = 0.45;
        }
      });

      if (foodMesh) {
        foodMesh.rotation.x += 0.02;
        foodMesh.rotation.y += 0.03;
      }

      renderer.render(scene, camera);
    }

    initGame();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
