<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Arcade - Play Free Games</title>
<style>
  :root {
    --bg: #0f1221;
    --card: #1a1e35;
    --accent: #6c5ce7;
    --text: #e9ecf1;
    --muted: #aab0c3;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, Arial, sans-serif; }
  body { background: var(--bg); color: var(--text); min-height: 100vh; }
  header { padding: 16px; background: var(--card); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
  header h1 { font-size: 20px; color: var(--accent); }
  nav button { background: transparent; border: 1px solid var(--accent); color: var(--text); padding: 8px 12px; border-radius: 8px; margin-left: 8px; cursor: pointer; }
  nav button:hover { background: var(--accent); }
  .container { max-width: 900px; margin: 20px auto; padding: 16px; }
  .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .card { background: var(--card); padding: 16px; border-radius: 12px; cursor: pointer; transition: transform 0.2s; }
  .card:hover { transform: translateY(-4px); }
  .card h3 { margin-bottom: 8px; }
  .card p { color: var(--muted); font-size: 14px; }
  .game-area { background: var(--card); padding: 20px; border-radius: 12px; margin-top: 20px; display: none; }
  .game-area.active { display: block; }
  footer { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }

  /* Snake */
  #snakeCanvas { background: #000; display: block; margin: 12px auto; border-radius: 8px; }
  .controls { text-align: center; margin-top: 8px; }
  .controls button { margin: 4px; padding: 8px 12px; border: none; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }

  /* TicTacToe */
  .board { display: grid; grid-template-columns: repeat(3, 80px); gap: 8px; justify-content: center; margin: 16px auto; }
  .cell { width: 80px; height: 80px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; border-radius: 8px; }

  /* Memory */
  .memory-grid { display: grid; grid-template-columns: repeat(4, 70px); gap: 10px; justify-content: center; margin: 16px auto; }
  .memory-card { width: 70px; height: 70px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 28px; border-radius: 8px; cursor: pointer; }
  .hidden { background: #333; color: #333; }
</style>
</head>
<body>
<header>
  <h1>🎮 Mini Arcade</h1>
  <nav>
    <button onclick="showHome()">Home</button>
  </nav>
</header>

<div class="container">
  <!-- Home -->
  <div id="home">
    <h2>Pick a Game</h2>
    <div class="games-grid">
      <div class="card" onclick="showGame('snake')">
        <h3>Snake</h3>
        <p>Eat food, grow longer. Don't hit the wall.</p>
      </div>
      <div class="card" onclick="showGame('ttt')">
        <h3>Tic Tac Toe</h3>
        <p>Play X vs O. Get 3 in a row.</p>
      </div>
      <div class="card" onclick="showGame('memory')">
        <h3>Memory Cards</h3>
        <p>Find all matching pairs.</p>
      </div>
    </div>
  </div>

  <!-- Snake Game -->
  <div id="snake" class="game-area">
    <h2>Snake</h2>
    <p>Score: <span id="snakeScore">0</span></p>
    <canvas id="snakeCanvas" width="300" height="300"></canvas>
    <div class="controls">
      <button onclick="setDir(0,-1)">Up</button><br>
      <button onclick="setDir(-1,0)">Left</button>
      <button onclick="setDir(1,0)">Right</button><br>
      <button onclick="setDir(0,1)">Down</button>
      <button onclick="startSnake()">Restart</button>
    </div>
  </div>

  <!-- Tic Tac Toe -->
  <div id="ttt" class="game-area">
    <h2>Tic Tac Toe</h2>
    <p id="tttStatus">Player X turn</p>
    <div class="board" id="tttBoard"></div>
    <button onclick="resetTTT()">Reset</button>
  </div>

  <!-- Memory -->
  <div id="memory" class="game-area">
    <h2>Memory Cards</h2>
    <p>Moves: <span id="moves">0</span></p>
    <div class="memory-grid" id="memoryGrid"></div>
    <button onclick="startMemory()">New Game</button>
  </div>
</div>

<footer>Made with ❤️ for simple fun. Works offline.</footer>

<script>
// Navigation
function showHome() {
  document.querySelectorAll('.game-area').forEach(g => g.classList.remove('active'));
  document.getElementById('home').style.display = 'block';
}
function showGame(id) {
  document.getElementById('home').style.display = 'none';
  document.querySelectorAll('.game-area').forEach(g => g.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id === 'snake') startSnake();
  if(id === 'ttt') resetTTT();
  if(id === 'memory') startMemory();
}

// Snake Game
let snake, dir, food, snakeScore, snakeInterval;
const canvas = document.getElementById('snakeCanvas');
const ctx = canvas.getContext('2d');
const grid = 20;

function startSnake() {
  snake = [{x:5, y:5}];
  dir = {x:1, y:0};
  food = {x:10, y:10};
  snakeScore = 0;
  document.getElementById('snakeScore').innerText = 0;
  clearInterval(snakeInterval);
  snakeInterval = setInterval(updateSnake, 120);
  placeFood();
}

function placeFood() {
  food.x = Math.floor(Math.random()*15);
  food.y = Math.floor(Math.random()*15);
}

function setDir(x,y) { dir = {x,y}; }
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowUp') setDir(0,-1);
  if(e.key === 'ArrowDown') setDir(0,1);
  if(e.key === 'ArrowLeft') setDir(-1,0);
  if(e.key === 'ArrowRight') setDir(1,0);
});
